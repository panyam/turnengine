syntax = "proto3";

package turnengine.v1;

import "google/protobuf/timestamp.proto";
import "turnengine/v1/models/models.proto";

option go_package = "github.com/panyam/turnengine/engine/gen/go/turnengine/v1/services";

// Game-agnostic coordination service for turn-based games
// This service knows nothing about specific game mechanics
service CoordinatorService {
  // Submit a proposal for validation
  rpc SubmitProposal(SubmitProposalRequest) returns (SubmitProposalResponse);
  
  // Get pending validations for a validator
  rpc GetPendingValidations(GetPendingValidationsRequest) returns (GetPendingValidationsResponse);
  
  // Submit validation result
  rpc SubmitValidation(SubmitValidationRequest) returns (SubmitValidationResponse);
  
  // Get proposal status
  rpc GetProposalStatus(GetProposalStatusRequest) returns (GetProposalStatusResponse);
}

// Core data structures - all game data is opaque

